<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendar local fixture</title><link rel="stylesheet" href="../team-board.css"><link rel="stylesheet" href="../content-calendar.css"><style>body{margin:0;padding:22px;font-family:Arial,sans-serif;background:#fffdf8;color:#16130e}main{max-width:1200px;margin:auto}.bbtn{padding:9px 12px;border:1px solid #ccc3b3;border-radius:5px;background:#fffdf8;color:#16130e;cursor:pointer}.bbtn.gold{background:#c8a96e}.team-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:30px}.fixture-note{background:#e5eefb;padding:12px;margin-bottom:22px}.cc-dialog{box-sizing:border-box}</style></head><body><main><p class="fixture-note">LOCAL TEST FIXTURE — fictional records, no CRM writes, no social posts.</p><section id="teamBoard" hidden></section><section id="contentCalendar"></section></main><script>
const actor='11111111-1111-4111-8111-111111111111';
const fixture={ok:true,actor,role:'management',campaigns:[{id:'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',version:1,name:'Fictional performance campaign',goal:'Test the specialist workspace',event_date:null}],members:[{id:actor,name:'Fixture specialist',role:'management'},{id:'22222222-2222-4222-8222-222222222222',name:'Fixture artist',role:'artist'}],entries:[],publishing:{connected:false}};
window.artistAuthHeaders=()=>({});window.renderTeamBoard=()=>{document.getElementById('teamBoard').hidden=false;document.getElementById('teamBoard').textContent='LOCAL FIXTURE: Team board';};window.openSharedTeamTask=()=>{};
window.fetch=async(url,options)=>{if(!String(url).includes('/functions/v1/content-calendar'))throw new Error('Fixture blocks external requests');const b=JSON.parse(options.body);if(b.action==='content_save'){const c={...b,owner:'team',production_task_id:crypto.randomUUID(),version:(b.version||0)+1,approval:'draft',task:{status:b.production_status,task_version:1,assignee_id:b.assignee_id,details:b.brief,due_date:b.due_date},review:{brand_approval:'draft',brand_reviewer_id:b.brand_reviewer_id},publications:b.target_platforms.map(platform=>({id:crypto.randomUUID(),platform,status:'draft',publisher_id:actor,lock_version:1}))};fixture.entries=[c,...fixture.entries.filter(x=>x.id!==c.id)];return new Response(JSON.stringify({ok:true,result:{id:c.id}}));}if(b.action==='publication_save'){const c=fixture.entries.find(x=>x.id===b.content_id),p=c.publications.find(x=>x.id===b.id);Object.assign(p,b,{lock_version:p.lock_version+1});return new Response(JSON.stringify({ok:true,result:{id:c.id}}));}if(b.action==='campaign_save'||b.action==='campaign_template'){fixture.campaigns.push({...b,version:1});return new Response(JSON.stringify({ok:true,result:{id:b.id}}));}return new Response(JSON.stringify(fixture));};
</script><script src="../content-calendar.js"></script><script>window.openContentCalendar();</script></body></html>
