<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Warren Will — App-Vorschau</title><style>body{margin:0;background:#f4f2ec}button,input,select,textarea{font:inherit}.preview-banner{padding:12px 20px;background:#e7d398;color:#243829;font:14px/1.5 Arial,sans-serif}.preview-banner select{margin-left:8px;padding:8px;border:1px solid #9f975e;border-radius:6px}</style><style>/* Warren Will artist workspace — mobile first, progressively enhanced. */
:root{--app-bg:#f4f2ec;--app-ink:#182923;--app-muted:#626d65;--app-line:#dce1d8;--app-green:#284f3c;--app-gold:#ddbd69}
#artistApp{max-width:1040px;margin:auto;padding:28px 22px 120px;color:var(--app-ink);font-family:Arial,Helvetica,sans-serif;line-height:1.5;font-size:16px}
#artistApp *,#artistDialog *{box-sizing:border-box}
#artistApp h1{font-size:clamp(30px,5vw,48px);line-height:1.1;letter-spacing:-1.5px;margin:8px 0 12px;font-weight:600}
#artistApp h2{font:600 21px/1.3 Arial,sans-serif;letter-spacing:-.4px;color:var(--app-ink);margin:28px 0 14px;padding:0;border:0}
#artistApp h2:before{display:none}#artistApp h3{font:600 17px/1.4 Arial,sans-serif;margin:0 0 7px;color:inherit}
#artistApp p{margin:6px 0 12px}#artistApp .eyebrow{text-transform:uppercase;font-size:11px;font-weight:700;letter-spacing:2px;color:var(--app-muted)}
#artistApp .muted,#artistDialog .muted{color:var(--app-muted);font-size:13px}
#artistApp .app-topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
#artistApp .app-titlebar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:25px}
#artistApp .app-btn,#artistDialog button,#artistDialog .app-btn{font:600 14px/1.3 Arial,sans-serif;letter-spacing:0;text-transform:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--app-line);border-radius:10px;min-height:44px;padding:10px 15px;background:white;color:var(--app-ink);cursor:pointer;text-decoration:none;white-space:normal}
#artistApp .primary,#artistDialog .primary{background:var(--app-green);border-color:var(--app-green);color:white}
#artistApp button:disabled,#artistDialog button:disabled{opacity:.5;cursor:not-allowed}
#artistApp button:focus-visible,#artistApp a:focus-visible,#artistDialog :focus-visible{outline:3px solid #a37a25;outline-offset:3px}
#artistApp .app-actions,#artistDialog .app-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
#artistApp .app-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
#artistApp .app-card{background:#fff;border:1px solid var(--app-line);border-radius:16px;padding:20px;min-width:0;overflow-wrap:anywhere}
#artistApp .app-card.hero{background:var(--app-ink);color:#fff;border:0;padding:26px}
#artistApp .hero .muted,#artistApp .hero .eyebrow{color:#b8c9bc}#artistApp .hero h3{font-size:26px;margin:16px 0 6px}#artistApp .hero .primary{background:var(--app-gold);border-color:var(--app-gold);color:#202a20}
#artistApp .app-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px 0;border-bottom:1px solid var(--app-line)}#artistApp .app-row:last-child{border-bottom:0}#artistApp .app-row>div:first-child{min-width:0}
#artistApp .app-list{background:white;border:1px solid var(--app-line);border-radius:16px;padding:0 20px}
#artistApp .app-date{display:block;color:var(--app-muted);font-size:12px;font-weight:600;margin-bottom:5px}
#artistApp .badge{display:inline-flex;align-items:center;font-size:12px;line-height:1.4;font-weight:600;border-radius:5px;padding:4px 7px;background:#eef2eb;color:#355640;margin:3px 4px 3px 0}
#artistApp .badge.attention{background:#faf0d9;color:#78570d}#artistApp .badge.problem{background:#fae9e4;color:#974b32}#artistApp .badge.neutral{background:#f0f1f0;color:#657169}
#artistApp .app-empty{padding:28px 22px;border:1px dashed #c9d2c7;border-radius:14px;color:var(--app-muted);background:#f9faf6}
#artistApp .app-notice{padding:12px 15px;margin-bottom:18px;background:#fbf2d9;border-radius:10px;font-size:13px;color:#78570d}
#artistApp .stat-number{font-size:28px;letter-spacing:-1px;display:block;font-weight:600;margin:8px 0}
#artistApp .stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:24px 0}
#artistApp .stat-grid .app-card{padding:16px}
#artistApp .app-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
#artistApp .app-filters button{border-radius:30px;font-size:12px;min-height:40px}#artistApp .app-filters button[aria-pressed=true]{background:var(--app-ink);color:white;border-color:var(--app-ink)}
#artistApp input,#artistApp select,#artistDialog input,#artistDialog select,#artistDialog textarea{width:100%;max-width:100%;min-height:46px;border:1px solid #c7d0c6;border-radius:8px;background:#fff;color:#182923;font:16px/1.4 Arial,sans-serif;padding:10px 12px;letter-spacing:0;outline-offset:3px}
#artistApp input[type=search]{margin:0 0 16px}#artistDialog input[type=checkbox]{width:22px;min-height:22px;vertical-align:middle}
#artistDialog label{display:block;font-size:13px;font-weight:600;color:var(--app-ink);margin:16px 0 6px}#artistDialog label>input,#artistDialog label>select,#artistDialog label>textarea{margin-top:6px}
#artistDialog{width:min(620px,calc(100% - 24px));max-height:calc(100dvh - 32px);padding:0;border:0;border-radius:20px;background:#f9faf6;color:var(--app-ink);box-shadow:0 25px 100px #14231b50;font:15px/1.5 Arial,sans-serif}
#artistDialog::backdrop{background:#14231b90}#artistDialog .dialog-inner{padding:24px}#artistDialog h2{font:600 24px/1.3 Arial,sans-serif;letter-spacing:-.5px;margin:0;color:inherit}
#artistDialog .dialog-header{display:flex;justify-content:space-between;align-items:start;gap:16px}#artistDialog .dialog-header button{min-width:44px;padding:8px}
#artistDialog .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}#artistDialog .dialog-footer{position:sticky;bottom:0;background:#f9faf6;padding:14px 24px;border-top:1px solid var(--app-line);display:flex;gap:12px;align-items:center;justify-content:space-between}
#artistDialog .form-error{color:#98412c;font-weight:600;font-size:13px;white-space:pre-wrap}#artistDialog .form-status{font-size:12px;color:var(--app-muted)}
#artistDialog .preview-table{overflow:auto;max-height:260px;font-size:12px}#artistDialog table{border-collapse:collapse;width:100%}#artistDialog td,#artistDialog th{padding:8px;text-align:left;border-bottom:1px solid var(--app-line)}
#artistNav{position:fixed;bottom:0;left:0;right:0;z-index:80;display:flex;justify-content:center;gap:8px;background:#fffef9f5;border-top:1px solid var(--app-line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}
#artistNav button{width:140px;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:6px 2px;color:#727a73;background:transparent;border:0;border-radius:10px;font:500 12px/1.2 Arial,sans-serif;letter-spacing:0;text-transform:none;cursor:pointer}
#artistNav button[aria-current=page]{background:#eaf0e7;color:#274c39;font-weight:700}#artistNav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#artistToast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:200;background:#182923;color:white;padding:12px 22px;border-radius:12px;max-width:90vw;font:14px/1.5 Arial,sans-serif;box-shadow:0 6px 28px #0002}
#artistApp .content-caption{white-space:pre-wrap;color:var(--app-muted);font-size:14px;max-height:130px;overflow:auto}
#artistApp .progress-line{height:5px;border-radius:5px;background:#e9eee6;margin:16px 0;overflow:hidden}#artistApp .progress-line span{display:block;background:#5f8867;height:100%}
@media(max-width:640px){#artistApp{padding:20px 16px 120px}#artistApp .app-grid{grid-template-columns:1fr}#artistApp .app-titlebar{align-items:start}#artistApp .app-titlebar>.app-btn{font-size:12px;padding:10px}#artistApp .stat-grid{grid-template-columns:1fr 1fr}#artistApp .stat-number{font-size:25px}#artistApp .app-card{padding:18px}#artistApp .app-row{gap:10px}#artistNav{gap:1px;padding-inline:5px}#artistNav button{width:20%;font-size:12px}#artistDialog .form-grid{grid-template-columns:1fr}#artistDialog .dialog-inner{padding:20px}#artistDialog .dialog-footer{padding:12px 20px}#top{flex-wrap:wrap;height:auto;min-height:66px;padding-block:12px}#genAt{display:none!important}}
@media(prefers-reduced-motion:reduce){#artistApp *,#artistDialog *{scroll-behavior:auto!important;transition:none!important}}

#artistNav[hidden],#artistApp[hidden],#artistToast[hidden]{display:none!important}
</style></head><body><div class="preview-banner"><b>Klickbare Vorschau · Beispieldaten</b> — noch nicht veröffentlicht. Speichern und Versand sind deaktiviert. <label>Ansicht<select id="previewRole"><option value="client">Warren</option><option value="team">Management</option><option value="social">Social-Team</option></select></label></div><div id="wview" hidden></div><script>const KEY='';const fixture={"ok": true, "role": "client", "app_ready": true, "generated_at": "2026-09-11T09:00:00Z", "contacts": [{"id": "00000000-0000-4000-8000-000000000001", "name": "Alex · Beispielkontakt", "email": "alex@example.com", "role": "booker", "source": "preview", "assigned_to": "warren", "follow_up_date": "2026-09-10", "next_action": "Terminwunsch besprechen", "tags": ["Club-Bookings"], "venues": {"name": "Beispiel-Club", "city": "München"}}], "gigs": [{"id": "00000000-0000-4000-8000-000000000002", "date": "2026-09-14", "fee": 350, "set_length": "21:00–23:00", "booking_status": "confirmed", "is_public": true, "venues": {"name": "Beispiel-Club", "city": "München"}}], "board": [{"id": "00000000-0000-4000-8000-000000000003", "title": "Set-Zeiten bestätigen", "kind": "ask", "owner": "warren", "status": "open", "priority": "high", "due_date": "2026-09-11", "details": "Dem Management die geplanten Spielzeiten mitteilen.", "comments": []}, {"id": "00000000-0000-4000-8000-000000000004", "title": "Neue Veranstalterliste vorbereiten", "kind": "work", "owner": "team", "status": "in_progress", "comments": []}], "content": [{"id": "00000000-0000-4000-8000-000000000005", "title": "Ausschnitt aus dem DJ-Set · Beispiel", "caption": "Ein kurzer Moment vom Dancefloor.\nVorschautext für die Künstlerfreigabe.", "version": 1, "approval": "waiting", "updated_at": "2026-09-11T08:00:00Z"}], "publications": [{"content_id": "00000000-0000-4000-8000-000000000005", "version": 1, "platform": "Instagram", "status": "planned", "scheduled_at": "2026-09-14T18:00:00Z"}], "invoices": [], "rentals": [], "inventory": [{"code": "bose", "name": "Bose L1 Pro8", "quantity": null}, {"code": "cdj3000", "name": "Pioneer CDJ-3000", "quantity": null}, {"code": "v10", "name": "Pioneer DJM-V10", "quantity": null}], "offers": [{"code": "bose", "name": "Bose L1 Pro8", "price_cents": 12500}, {"code": "cdj3000", "name": "Pioneer CDJ-3000", "price_cents": 8500}, {"code": "v10", "name": "Pioneer DJM-V10", "price_cents": 7500}, {"code": "club", "name": "Club-Setup", "price_cents": 21500}], "metrics": [], "pipeline": []}; window.fetch=async()=>new Response(JSON.stringify({ok:false,error:'Dies ist eine Vorschau. Es werden keine Daten gespeichert oder Nachrichten versendet.'}),{status:400,headers:{'Content-Type':'application/json'}});async function post(){throw new Error('Vorschau: Speichern ist deaktiviert.');}async function load(){await window.renderArtistWorkspace(fixture);} </script><script>/* Artist workspace; no secrets, API caches or simulated production records. */
(() => {
 'use strict';
 const API='https://tqwaepvdsvyyfgtlurkm.supabase.co/functions/v1/artist-workspace';
 const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const money=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(Number(n||0)/100);
 const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Berlin'}).format(new Date());
 const date=s=>s?new Date(s.length===10?s+'T12:00:00':s).toLocaleDateString('de-DE',{day:'numeric',month:'short',year:'numeric',timeZone:'Europe/Berlin'}):'Ohne Termin';
 const link=s=>{try{return new URL(s).protocol==='https:'?s:'';}catch{return '';}};
 const badge=(s,style='')=>`<span class="badge ${style}">${E(s)}</span>`;
 const empty=s=>`<div class="app-empty">${E(s)}</div>`;
 const button=(text,action,id='',primary=false)=>`<button type="button" class="app-btn ${primary?'primary':''}" data-app="${action}" data-id="${E(id)}">${E(text)}</button>`;
 const paths={today:'M3 10 12 3l9 7M5 9v12h5v-7h4v7h5V9',contacts:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M17 4a4 4 0 0 1 0 8M22 21v-2a4 4 0 0 0-3-4',bookings:'M8 2v4m8-4v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2',content:'M4 3h16v18H4zM10 8l6 4-6 4z',results:'M4 20h17M7 16v-4m5 4V5m5 11V8'};
 const names={today:'Heute',contacts:'Kontakte',bookings:'Buchungen',content:'Inhalte',results:'Ergebnisse'};
 const state={d:null,tab:'today',segment:'all',query:'',bookFilter:'upcoming',contentFilter:'all',allTasks:false,ready:false,loading:false};
 let root,nav,dialog,saveHandler=null,draftKey='',toastTimer,renderGeneration=0;
 const authHeaders=()=>window.artistAuthHeaders?window.artistAuthHeaders():{'x-admin-key':KEY};
 async function api(body){if(!navigator.onLine)throw new Error('Du bist offline. Dein Entwurf bleibt erhalten. Bitte später speichern.');const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',...authHeaders()},body:JSON.stringify(body)});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Speichern fehlgeschlagen.');return d;}
 async function legacy(body){return state.ready?api({action:'legacy',payload:body}):post(body);}
 function toast(s){let t=document.getElementById('artistToast');if(!t){t=document.createElement('div');t.id='artistToast';t.setAttribute('role','status');document.body.append(t);}t.textContent=s;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,5000);}
 function init(){if(root)return;root=document.createElement('main');root.id='artistApp';root.hidden=true;document.querySelector('#wview').after(root);nav=document.createElement('nav');nav.id='artistNav';nav.setAttribute('aria-label','Hauptnavigation');nav.hidden=true;document.body.append(nav);dialog=document.createElement('dialog');dialog.id='artistDialog';document.body.append(dialog);
 root.addEventListener('click',onClick);nav.addEventListener('click',onClick);dialog.addEventListener('click',onClick);
 root.addEventListener('input',e=>{if(e.target.id==='appSearch'){state.query=e.target.value;renderList();}});
 dialog.addEventListener('input',saveDraft);dialog.addEventListener('change',saveDraft);
 dialog.addEventListener('cancel',saveDraft);
 dialog.addEventListener('submit',async e=>{e.preventDefault();if(!saveHandler)return;const btn=dialog.querySelector('[type=submit]');btn.disabled=true;dialog.querySelector('.form-error').textContent='';dialog.querySelector('.form-status').textContent='Wird gespeichert …';try{await saveHandler(new FormData(e.target));sessionStorage.removeItem(draftKey);dialog.close();history.replaceState(null,'','#'+state.tab);toast('Gespeichert');await load();}catch(err){dialog.querySelector('.form-error').textContent=err.message;dialog.querySelector('.form-status').textContent='Nicht gespeichert · Entwurf bleibt erhalten';btn.disabled=false;}});
 window.addEventListener('hashchange',()=>{if(!root.hidden){readRoute();render();}});
 window.addEventListener('offline',()=>{toast('Offline · Änderungen bleiben als Entwurf.');if(state.d)render();});window.addEventListener('online',()=>{toast('Wieder online. Bitte Änderungen speichern.');if(state.d)render();});
 }
 function readRoute(){const part=location.hash.replace('#','').split('/');state.tab=names[part[0]]?part[0]:'today';}
 window.hideArtistWorkspace=()=>{if(root){root.hidden=true;nav.hidden=true;}if(dialog?.open)dialog.close();};
 window.renderArtistWorkspace=async(base)=>{init();root.hidden=false;nav.hidden=false;document.querySelector('#wview').style.display='none';state.d=base;state.ready=!!base.app_ready;readRoute();if(base.role==='social'&&!['content','results'].includes(state.tab))state.tab='content';render();
 const version=++renderGeneration;if(state.ready){openRoute();return;}
 try{const full=await api({action:'dashboard'});if(version!==renderGeneration||root.hidden)return;state.d=full;state.ready=true;render();openRoute();}catch{if(version===renderGeneration){state.ready=false;render();openRoute();}}
 };
 function openRoute(){const [tab,id]=location.hash.slice(1).split('/');if(id&&!dialog.open){if(tab==='contacts')openContact(id);if(tab==='bookings')openGig(id);if(tab==='content')openContent(id);}}
 function changeTab(tab){state.tab=tab;location.hash=tab;render();window.scrollTo({top:0,behavior:'instant'});}
 const extNotice=()=>state.ready?'':'<div class="app-notice">Die neue Datenanbindung ist noch nicht freigeschaltet. Bestehende Kontakte, Auftritte und Rechnungen sind weiterhin erreichbar.</div>';
 function render(){if(!state.d)return;const social=state.d.role==='social';nav.innerHTML=Object.entries(names).filter(([k])=>!social||['content','results'].includes(k)).map(([k,v])=>`<button data-app="tab" data-id="${k}" ${k===state.tab?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[k]}"/></svg>${v}</button>`).join('');
 const head=`<div class="app-topline"><span class="eyebrow">Warren Will / Artist workspace</span><span class="muted">${navigator.onLine?'● Online':'○ Offline'}</span></div>`;
 root.innerHTML=head+(!navigator.onLine?'<div class="app-notice">Offline · Angezeigter Stand bleibt sichtbar. Verbindliche Änderungen benötigen eine Online-Bestätigung.</div>':'')+({today:renderToday,contacts:renderContacts,bookings:renderBookings,content:renderContent,results:renderResults}[state.tab])();
 if(state.tab==='contacts')renderList();
 }
 const upcoming=()=> (state.d.gigs||[]).filter(g=>g.date>=today()&&g.booking_status!=='cancelled'&&g.booking_status!=='draft').sort((a,b)=>a.date.localeCompare(b.date));
 function tasks(){const d=state.d;const b=(d.board||[]).filter(x=>!x.archived_at&&!['done','approved','declined'].includes(x.status)&&(x.owner==='warren'||(!x.owner&&['ask','approval'].includes(x.kind)))).map(x=>({id:x.id,title:x.title,due:x.due_date,priority:x.priority,kind:'task',label:x.kind==='approval'?'Entscheidung ansehen':'Aufgabe öffnen'}));
 const contacts=(d.contacts||[]).filter(c=>!c.opt_out_at&&c.assigned_to==='warren'&&c.follow_up_date&&c.follow_up_date<=today()).map(c=>({id:c.id,title:c.next_action||'Bei '+c.name+' nachfassen',due:c.follow_up_date,kind:'contact',label:'Kontakt öffnen'}));
 const contents=(d.content||[]).filter(c=>c.approval==='waiting').map(c=>({id:c.id,title:c.title,kind:'content',label:'Inhalt freigeben',priority:'normal'}));
 return [...contacts,...b,...contents].sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')||({'high':0,'normal':1,'low':2}[a.priority||'normal']-{'high':0,'normal':1,'low':2}[b.priority||'normal']));}
 function renderToday(){const all=tasks(),n=upcoming()[0],d=state.d;return `<div class="app-titlebar"><div><div class="eyebrow">${new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',timeZone:'Europe/Berlin'})}</div><h1>Servus, Warren.</h1><p class="muted">Dein nächster Schritt. Dein nächster Auftritt.</p></div>${button('Aktualisieren','refresh')}</div>
 <div class="app-grid"><section class="app-card hero"><div class="eyebrow">Dein nächster Auftritt</div>${n?`<h3>${E(n.venues?.name||'Veranstaltungsort offen')}</h3><p>${date(n.date)} · ${E(n.venues?.city||'')}</p><p class="muted">${E(n.set_length||'Spielzeit noch offen')} · ${n.fee==null?'Gage offen':money(n.fee*100)}</p>${button('Buchung ansehen','gig',n.id,true)}`:'<h3>Platz für neue Dates.</h3><p class="muted">Noch kein kommender Auftritt eingetragen.</p>'+button('Auftritt eintragen','new-gig','',true)}</section>
 <section class="app-card"><div class="eyebrow">Diese Woche im Blick</div><div class="app-row"><div>Offene Aktionen für dich</div><b>${all.length}</b></div><div class="app-row"><div>Kommende Auftritte</div><b>${upcoming().length}</b></div><div class="app-row"><div>Inhalte zur Freigabe</div><b>${state.ready?(d.content||[]).filter(x=>x.approval==='waiting').length:'—'}</b></div></section></div>

 <h2>Das Team arbeitet daran</h2><div class="app-list">${(d.board||[]).filter(x=>!x.archived_at&&['open','in_progress'].includes(x.status)&&(x.owner==='team'||x.owner==='lutho'||(!x.owner&&x.kind==='work'))).slice(0,4).map(x=>`<div class="app-row"><div><h3>${E(x.title)}</h3><span class="muted">${E(x.owner==='lutho'?'Lutho':'Team')}${x.due_date?' · '+date(x.due_date):''}</span></div>${badge(x.status==='in_progress'?'In Arbeit':'Offen','neutral')}</div>`).join('')||'<p class="muted">Keine offenen Team-Aufgaben.</p>'}</div>`;}

 function renderContent(){const d=state.d;const list=(d.content||[]).filter(c=>state.contentFilter==='all'||c.approval===state.contentFilter);return `<div class="app-titlebar"><div><div class="eyebrow">Vom Entwurf bis zum Beitrag</div><h1>Inhalte</h1></div>${d.role!=='client'?button('+ Inhalt','new-content','',true):''}</div>${extNotice()}<p class="muted">Freigaben erfolgen hier. Das Social-Team veröffentlicht über sein Planungstool und hinterlegt den Nachweis je Plattform.</p><div class="app-filters">${[['all','Alle'],['waiting','Zur Freigabe'],['approved','Freigegeben'],['changes','Änderungen']].map(([k,n])=>`<button class="app-btn" data-app="content-filter" data-id="${k}" aria-pressed="${state.contentFilter===k}">${n}</button>`).join('')}</div>${list.length?`<div class="app-grid">${list.map(c=>{const pubs=(d.publications||[]).filter(p=>p.content_id===c.id);return `<article class="app-card"><div class="eyebrow">Version ${c.version} · ${date(c.updated_at)}</div><h3 style="margin-top:10px">${E(c.title)}</h3>${badge(({draft:'Entwurf',waiting:'Wartet auf Warren',approved:'Freigegeben',changes:'Änderungen erbeten'})[c.approval],c.approval==='waiting'?'attention':'')}<p class="content-caption">${E(c.caption)}</p>${pubs.map(p=>`<div class="app-row"><div><b>${E(p.platform)}</b> ${p.version!==c.version?badge('Version '+p.version,'neutral'):''}<div class="muted">${({planned:'Geplant',published:'Veröffentlicht · manuell belegt',failed:'Fehlgeschlagen · Team prüft'})[p.status]}</div></div>${p.post_url&&link(p.post_url)?`<a class="app-btn" target="_blank" rel="noopener noreferrer" href="${E(link(p.post_url))}">Beitrag ↗</a>`:''}</div>`).join('')||'<p class="muted">Noch keine Veröffentlichung hinterlegt.</p>'}<div class="app-actions">${button(c.approval==='waiting'&&d.role==='client'?'Freigabe ansehen':'Details','content',c.id,c.approval==='waiting')}</div></article>`;}).join('')}</div>`:empty('Hier erscheinen vorbereitete Inhalte und ihre Veröffentlichungen. Noch keine Inhalte  function renderResults(){const d=state.d,year=today().slice(0,4);const gigs=(d.gigs||[]).filter(g=>g.date.startsWith(year)&&!['draft','cancelled'].includes(g.booking_status));const published=(d.publications||[]).filter(p=>p.status==='published');return `<div class="app-titlebar"><div><div class="eyebrow">Was sich bewegt</div><h1>Ergebnisse</h1><p class="muted">Quelle, Zeitraum und Datenstand bleiben sichtbar.</p></div>${d.role!=='client'?button('+ Kennzahl','metric'):''}</div>${d.role!=='social'?`<div class="stat-grid"><div class="app-card"><span class="muted">Gebuchte Gagen · ${year}</span><b class="stat-number">${money(gigs.reduce((s,g)=>s+Number(g.fee||0)*100,0))}</b><span class="muted">Vereinbart, kein Zahlungseingang</span></div><div class="app-card"><span class="muted">Als bezahlt markierte Rechnungen</span><b class="stat-number">${money((d.invoices||[]).filter(i=>i.status==='paid').reduce((s,i)=>s+i.gross_cents,0))}</b><span class="muted">Geladene Rechnungen · ohne Bankabgleich</span></div><div class="app-card"><span class="muted">Offene versendete Rechnungen</span><b class="stat-number">${money((d.invoices||[]).filter(i=>i.status==='sent').reduce((s,i)=>s+i.gross_cents,0))}</b><span class="muted">Entwürfe sind nicht enthalten</span></div></div>`:''}<h2>Veröffentlichungen</h2><div class="app-card"><b class="stat-number">${state.ready?published.length:'—'}</b><p>Hinterlegte Plattform-Veröffentlichungen</p><p class="muted">Mehrfachveröffentlichungen werden je Plattform gezählt. Keine Aussage über eindeutige Personen.</p></div><h2>Musik & Social</h2>${(d.metrics||[]).length?`<div class="app-grid">${d.metrics.map(m=>`<article class="app-card"><div class="eyebrow">${E(m.platform)}</div><h3>${E(m.metric)}</h3><b class="stat-number">${Number(m.value).toLocaleString('de-DE')}</b><p class="muted">${date(m.period_start)} – ${date(m.period_end)}</p><p class="muted">Manuell erfasst · Datenstand ${date(m.recorded_at)}</p>${Date.now()-Date.parse(m.recorded_at)>7*86400000?badge('Seit mehr als 7 Tagen nicht aktualisiert','attention'):''}<p class="muted">${E(m.note||'')}</p><a class="app-btn" href="${E(link(m.source_url))}" target="_blank" rel="noopener noreferrer">Quelle öffnen ↗</a></article>`).join('')}</div>`:empty('Noch keine verifizierten Kennzahlen. Fehlende Daten sind nicht null.')}

 function field(label,name,value='',type='text',extra=''){return `<label>${E(label)}<input name="${name}" type="${type}" value="${E(value)}" ${extra}></label>`;}

 function saveDraft(){if(!dialog?.open||!draftKey)return;const values={};dialog.querySelectorAll('input[name],select[name],textarea[name]').forEach(el=>{if(!['file','password'].includes(el.type))values[el.name]=el.type==='checkbox'?el.checked:el.value;});try{sessionStorage.setItem(draftKey,JSON.stringify(values));}catch{dialog.querySelector('.form-status').textContent='Entwurfssicherung ist in diesem Browser nicht verfügbar.';}}
 function modal(title,html,handler=null,key=''){init();saveHandler=handler;draftKey=key?'ww-draft:'+state.d.role+':'+key:'';dialog.innerHTML=`<form><div class="dialog-inner"><div class="dialog-header"><h2>${E(title)}</h2>${button('Schließen','close')}</div>${html}<p class="form-error" role="alert"></p></div><div class="dialog-footer"><span class="form-status" role="status">${handler?'Entwurf · noch nicht gespeichert':''}</span>${handler?'<button class="primary" type="submit">Speichern</button>':button('Fertig','close')}</div></form>`;
 if(draftKey){try{const values=JSON.parse(sessionStorage.getItem(draftKey)||'null');if(values){dialog.querySelectorAll('[name]').forEach(el=>{if(values[el.name]!==undefined){if(el.type==='checkbox')el.checked=values[el.name];else if(el.type!=='file')el.value=values[el.name];}});dialog.querySelector('.form-status').textContent='Dein Entwurf wurde wiederhergestellt.';}}catch{}}
 if(!dialog.open)dialog.showModal();}

 function openGig(id){const g=(state.d.gigs||[]).find(x=>x.id===id);if(!g)return;modal('Auftritt bearbeiten',`<div class="form-grid">${field('Datum','date',g.date,'date','required')}${field('Gage in €','fee',g.fee??'','number','min="0" step="0.01"')}</div>${field('Venue / Veranstaltung','venue_name',g.venues?.name,'text','required')}${field('Stadt','city',g.venues?.city)}${field('Spielzeit','set_length',g.set_length)}<label><input type="checkbox" name="deposit_received" ${g.deposit_received?'checked':''}> Anzahlung erhalten</label>${state.ready?select('Buchungsstatus','booking_status',[['confirmed','Bestätigt'],['draft','Entwurf'],['cancelled','Abgesagt']],g.booking_status||'confirmed')+`<label><input type="checkbox" name="is_public" ${g.is_public?'checked':''}> Auf der Website veröffentlichen</label><p class="muted">Öffentlich erscheinen nur bestätigte, freigegebene Termine. Gage und Kontaktdaten bleiben privat.</p>`:''}<h3 style="margin-top:22px">Rechnungen zu diesem Auftritt</h3>${(state.d.invoices||[]).filter(i=>i.gig_id===g.id).map(i=>`<p>${E(i.invoice_number)} · ${money(i.gross_cents)} ${button('Prüfen','invoice',i.id)}</p>`).join('')||'<p class="muted">Noch keine Rechnung verknüpft.</p>'}${state.d.role==='team'?button('Rechnungsentwurf erstellen','new-invoice',g.id):'<p class="muted">Das Management erstellt und versendet Rechnungen.</p>'}`,

 function parseCSV(text){text=text.replace(/^\uFEFF/,'');const first=text.split(/\r?\n/)[0];const delimiter=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';const rows=[];let row=[],cell='',quote=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quote&&text[i+1]==='"'){cell+='"';i++;}else quote=!quote;}else if(c===delimiter&&!quote){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell='';}else cell+=c;}if(quote)throw new Error('Nicht geschlossene Anführungszeichen in der CSV.');row.push(cell);if(row.some(v=>v.trim()))rows.push(row);return rows;}
 function importContacts(){if(!requiredReady())return;let rows=[];modal('PhantomBuster-Kontakte importieren',`<p class="muted">CSV auswählen, Spalten zuordnen und prüfen. Bekannte E-Mail-Adressen oder Telefonnummern werden übersprungen; vorhandene Kontakte bleiben erhalten. Es wird nichts versendet.</p>${field('Importquelle / Liste','source','PhantomBuster','text','required')}${select('Geprüfte Grundlage der Kontaktdaten','lawful_basis',[['','Bitte prüfen und auswählen'],['existing_relationship','Bestehende Beziehung'],['consent','Einwilligung dokumentiert'],['impressum_published','Veröffentlichte Geschäftsadresse'],['legitimate_interest','Berechtigtes Interesse geprüft'],['contract','Vertragsbeziehung']],'')}<label>CSV-Datei<input id="appCSV" type="file" accept=".csv,text/csv"></label><div id="csvMapping"></div><div id="csvPreview" class="preview-table"></div><p class="muted" id="csvProgress"></p>`,async fd=>{if(!rows.length)throw new Error('Bitte zuerst eine CSV prüfen.');if(!fd.get('lawful_basis'))throw new Error('Bitte Datenherkunft prüfen und Grundlage auswählen.');const headers=rows[0],map=name=>Number(dialog.querySelector('[name="map_'+name+'"]').value);const data=rows.slice(1).map(r=>({name:r[map('name')]||'',email:r[map('email')]||'',phone_whatsapp:r[map('phone')]||'',notes:r[map('notes')]||''}));if(data.some(r=>!r.name||(!r.email&&!r.phone_whatsapp)))throw new Error('Jede Zeile braucht einen Namen und E-Mail oder Telefon. Spalten prüfen.');let n=0,k=0;for(let start=0;start<data.length;start+=50){const result=await api({action:'import_contacts',source:fd.get('source'),lawful_basis:fd.get('lawful_basis'),rows:data.slice(start,start+50)});n+=result.created;k+=result.skipped;dialog.querySelector('#csvProgress').textContent=`${Math.min(start+50,data.length)} / ${data.length} geprüft · ${n} neu · ${k} übersprungen`;}toast(`${n} Kontakte importiert, ${k} übersprungen.`);},'import');
 dialog.querySelector('#appCSV').addEventListener('change',async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>5*1024*1024)throw new Error('Bitte Dateien unter 5 MB verwenden.');rows=parseCSV(await f.text());if(rows.length<2||rows.length>5001)throw new Error('Datei muss 1 bis 5.000 Kontakte enthalten.');const options=[['-1','Nicht vorhanden'],...rows[0].map((h,i)=>[String(i),h])];const guess=re=>String(rows[0].findIndex(h=>re.test(h)));dialog.querySelector('#csvMapping').innerHTML=select('Name-Spalte','map_name',options,guess(/^(full.?name|name)$/i))+select('E-Mail-Spalte','map_email',options,guess(/email|e-mail/i))+select('Telefon-Spalte','map_phone',options,guess(/phone|telefon|whatsapp/i))+select('Notiz-Spalte','map_notes',options,guess(/notes?|notiz/i));dialog.querySelector('#csvPreview').innerHTML='<p>'+String(rows.length-1)+' Zeilen · Vorschau der ersten 5</p><table><thead><tr>'+rows[0].map(h=>'<th>'+E(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(1,6).map(r=>'<tr>'+r.map(v=>'<td>'+E(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';}catch(err){rows=[];dialog.querySelector('.form-error').textContent=err.message;}});}
